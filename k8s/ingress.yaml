# Only the API is exposed; /actuator and every other service stay inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voting-api
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
