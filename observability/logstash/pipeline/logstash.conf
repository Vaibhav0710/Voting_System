# Services with the "logstash" Spring profile send one JSON object per line over TCP 5000
# (LogstashTcpSocketAppender); each event already carries service, level, traceId/spanId and AUDIT fields.
input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "voting-logs-%{+YYYY.MM.dd}"
  }
}
