# Scrapes every service's Micrometer endpoint inside the compose network.
# 5 s so a 15 s load-test level still gets three samples (connection-pool waits are short spikes).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: voting-system
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - eureka-server:8761
          - api-gateway:8080
          - user-service:8081
          - candidate-service:8082
          - voting-service:8083
          - result-service:8084
