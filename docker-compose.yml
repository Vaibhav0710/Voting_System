# Whole voting system in one command:
#   cp .env.example .env   (fill in the REQUIRED values)
#   docker compose up -d --build
# Add the observability stack (ELK, Prometheus, Grafana, Zipkin):
#   docker compose --profile observability up -d --build
#
# Only the API gateway (8080) is published on all interfaces; everything else is bound to 127.0.0.1
# for local debugging, or not published at all.

name: voting-system

x-java-service: &java-service
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  networks:
    - voting

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-json-logs}
  EUREKA_URL: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFERIPADDRESS: "true"
  TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
  ZIPKIN_URL: http://zipkin:9411/api/v2/spans
  LOGSTASH_HOST: logstash
  LOGSTASH_PORT: "5000"

x-db-env: &db-env
  VOTING_DB_URL: jdbc:postgresql://postgres:5432
  VOTING_DB_USER: ${VOTING_DB_USER:?set VOTING_DB_USER in .env}
  VOTING_DB_PASSWORD: ${VOTING_DB_PASSWORD:?set VOTING_DB_PASSWORD in .env}

services:
  # ── Infrastructure ────────────────────────────────────────────────────
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VOTING_DB_USER:?set VOTING_DB_USER in .env}
      POSTGRES_PASSWORD: ${VOTING_DB_PASSWORD:?set VOTING_DB_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [voting]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [voting]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [voting]

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Containers use kafka:29092; tools on the host use localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [voting]

  # ── Application ───────────────────────────────────────────────────────
  eureka-server:
    <<: *java-service
    build: ./eureka-server
    image: voting/eureka-server:1.0.0
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-json-logs}
      LOGSTASH_HOST: logstash
    ports:
      - "127.0.0.1:8761:8761"

  user-service:
    <<: *java-service
    build: ./user-service
    image: voting/user-service:1.0.0
    environment:
      <<: [*common-env, *db-env]
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${USER_SERVICE_HIKARI_MAXIMUM_POOL_SIZE:-20}
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }

  candidate-service:
    <<: *java-service
    build: ./candidate-service
    image: voting/candidate-service:1.0.0
    environment:
      <<: [*common-env, *db-env]
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eureka-server: { condition: service_healthy }

  voting-service:
    <<: *java-service
    build: ./voting-service
    image: voting/voting-service:1.0.0
    environment:
      <<: [*common-env, *db-env]
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      VOTING_CHAIN_ENABLED: ${VOTING_CHAIN_ENABLED:-true}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${VOTING_SERVICE_HIKARI_MAXIMUM_POOL_SIZE:-10}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eureka-server: { condition: service_healthy }

  result-service:
    <<: *java-service
    build: ./result-service
    image: voting/result-service:1.0.0
    environment:
      <<: *common-env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eureka-server: { condition: service_healthy }

  api-gateway:
    <<: *java-service
    build: ./api-gateway
    image: voting/api-gateway:1.0.0
    environment:
      <<: *common-env
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GATEWAY_AUTH_REPLENISH_RATE: ${GATEWAY_AUTH_REPLENISH_RATE:-10}
      GATEWAY_AUTH_BURST_CAPACITY: ${GATEWAY_AUTH_BURST_CAPACITY:-20}
    ports:
      - "8080:8080"
    depends_on:
      redis: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      user-service: { condition: service_healthy }

  # ── Observability (docker compose --profile observability …) ─────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: [observability]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # local only; never expose this port
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [voting]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    profiles: [observability]
    volumes:
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [voting]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: [observability]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [voting]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [voting]

  grafana:
    image: grafana/grafana:11.2.2
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks: [voting]

  zipkin:
    image: openzipkin/zipkin:3.4
    profiles: [observability]
    ports:
      - "127.0.0.1:9411:9411"
    networks: [voting]

volumes:
  pgdata:
  redisdata:
  esdata:

networks:
  voting:
    driver: bridge
